
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goofyy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:white;min-height:100vh}
nav{width:100%;background:#181818;padding:20px;display:flex;justify-content:center;gap:10px;border-bottom:1px solid #333}
nav button{background:transparent;color:white;border:0;padding:12px 20px;font-size:16px;cursor:pointer;border-radius:8px}
nav button:hover{background:#292929}
nav button.active{background:white;color:black}
.page{display:none;max-width:1100px;margin:0 auto;padding:60px 25px}
.page.active{display:block}
#home{text-align:center}
#home h1{font-size:70px;margin-bottom:20px}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:30px}
.project-card{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:25px;min-height:180px;transition:transform .2s,border-color .2s}
.project-card:hover{transform:translateY(-5px);border-color:#777}
.project-card h3{font-size:22px;margin-bottom:12px}
.project-card p{color:#aaa;line-height:1.5;margin-bottom:20px}
.project-card a{color:white;text-decoration:none;font-weight:bold}
.project-card a:hover{text-decoration:underline}
@media(max-width:600px){
nav{flex-wrap:wrap}
#home h1{font-size:50px}
.page{padding:40px 20px}
}
</style>
</head>
<body>

<nav>
<button type="button" onclick="showPage('home')" class="active" id="homeButton">Home</button>
<button type="button" onclick="showPage('projects')" id="projectsButton">Projects</button>
</nav>

<section id="home" class="page active">
<h1>Goofyy</h1>
</section>

<section id="projects" class="page">
<h1>Projects</h1>
<div class="projects-grid" id="projectsGrid"></div>
</section>

<script>
const projects = [
  {
    name: "Geometry Dash Timer",
    description: "A Geometry Dash themed timer.",
    link: "geometry-timer/"
  },
  {
    name: "Death Counter",
    description: "A simple death counter.",
    link: "death-counter/"
  },
  {
    name: "Countdown Timer",
    description: "A simple countdown timer with a time adding feature.",
    link: "countdown-timer/"
  },
  {
    name: "Multi Stream",
    description: "Watch up to 4 streams at one time.",
    link: "multi-stream/"
  },
  {
    name: "Chest Counter",
    description: "Keep track of how many Fortnite chests you've opened.",
    link: "chest-counter.html"
  },
  {
    name: "Team Scoreboard",
    description: "A scoreboard with customizable teams, colors, scores, and players.",
    link: "team-scoreboard.html"
  }
];

const projectsGrid = document.getElementById("projectsGrid");

projects.forEach(function(project){
 const card=document.createElement("div");
 card.className="project-card";
 card.innerHTML=`<h3>${project.name}</h3><p>${project.description}</p>${project.link?`<a href="${project.link}">View Project →</a>`:""}`;
 projectsGrid.appendChild(card);
});

function showPage(pageName){
 document.querySelectorAll(".page").forEach(page=>page.classList.remove("active"));
 document.querySelectorAll("nav button").forEach(button=>button.classList.remove("active"));

 const page=document.getElementById(pageName);
 const button=document.getElementById(pageName+"Button");

 if(page && button){
  page.classList.add("active");
  button.classList.add("active");
 }
}
</script>

</body>
</html>
