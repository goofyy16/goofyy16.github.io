<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goofyy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            width: 100%;
            background: #181818;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            border-bottom: 1px solid #333;
        }

        nav button {
            background: transparent;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
        }

        nav button:hover {
            background: #292929;
        }

        nav button.active {
            background: white;
            color: black;
        }

        /* =========================
           PAGES
        ========================= */

        .page {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 25px;
        }

        .page.active {
            display: block;
        }

        /* =========================
           HOME
        ========================= */

        #home {
            text-align: center;
        }

        #home h1 {
            font-size: 70px;
            margin-bottom: 20px;
        }

        #home p {
            font-size: 20px;
            color: #aaa;
        }

        /* =========================
           PROJECTS
        ========================= */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .project-card {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            min-height: 180px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: #777;
        }

        .project-card h3 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .project-card p {
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .project-card a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .project-card a:hover {
            text-decoration: underline;
        }

        /* =========================
           ABOUT
        ========================= */

        .content-box {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
        }

        .content-box p {
            color: #bbb;
            line-height: 1.7;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact-links {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-links a {
            display: block;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 18px;
            color: white;
            text-decoration: none;
        }

        .contact-links a:hover {
            background: #292929;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {
            nav {
                flex-wrap: wrap;
            }

            #home h1 {
                font-size: 50px;
            }

            .page {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>
        <button onclick="showPage('home')" class="active" id="homeButton">
            Home
        </button>

        <button onclick="showPage('projects')" id="projectsButton">
            Projects
        </button>

        <button onclick="showPage('about')" id="aboutButton">
            About
        </button>

        <button onclick="showPage('contact')" id="contactButton">
            Contact
        </button>
    </nav>


    <!-- =========================
         HOME PAGE
    ========================= -->

    <section id="home" class="page active">

        <h1>Goofyy</h1>

        </p>

    </section>


    <!-- =========================
         PROJECTS PAGE
    ========================= -->

    <section id="projects" class="page">

        <h1>Projects</h1>

        </p>

        <div class="projects-grid" id="projectsGrid">
            <!-- Projects will automatically appear here -->
        </div>

    </section>


    <!-- =========================
         ABOUT PAGE
    ========================= -->

    <section id="about" class="page">

        <h1>About</h1>

        <div class="content-box">

            </p>

        </div>

    </section>


    <!-- =========================
         CONTACT PAGE
    ========================= -->

    <section id="contact" class="page">

        <h1>Contact</h1>

        <div class="contact-links">

            <!--
                ADD YOUR LINKS HERE IN THE FUTURE.

                Example:

                <a href="https://twitch.tv/YOUR_USERNAME">
                    Twitch
                </a>
            -->

        </div>

    </section>


    <script>

        /* =====================================================
           PROJECTS

           EDIT YOUR PROJECTS HERE IN THE FUTURE.

           Each project has:

           name        = Project name
           description = Description of the project
           link        = Website/project link

           Leave them blank if you aren't ready to add anything.
        ===================================================== */

        const projects = [

            {
                name: "Geometry Dash Timer",
                description: "A Geometry Dash themed timer with a reset button.",
                link: "geometry-timer/"
            },

            {
    name: "Death Counter",
    description: "A simple death counter with +1 and reset buttons.",
    link: "death-counter/"
},

            {
                name: "",
                description: "",
                link: ""
            },

            {
                name: "",
                description: "",
                link: ""
            }

        ];


        /* =====================================================
           CREATE PROJECT CARDS
        ===================================================== */

        const projectsGrid = document.getElementById("projectsGrid");

        projects.forEach(function(project) {

            // Don't display completely empty projects
            if (
                project.name === "" &&
                project.description === "" &&
                project.link === ""
            ) {
                return;
            }

            const card = document.createElement("div");

            card.className = "project-card";

            card.innerHTML = `
                <h3>${project.name}</h3>

                <p>
                    ${project.description}
                </p>

                ${
                    project.link
                    ? `<a href="${project.link}" target="_blank">
                        View Project →
                       </a>`
                    : ""
                }
            `;

            projectsGrid.appendChild(card);

        });


        /* =====================================================
           TAB SYSTEM
        ===================================================== */

        function showPage(pageName) {

            // Hide every page
            const pages = document.querySelectorAll(".page");

            pages.forEach(function(page) {
                page.classList.remove("active");
            });


            // Remove active state from every button
            const buttons = document.querySelectorAll("nav button");

            buttons.forEach(function(button) {
                button.classList.remove("active");
            });


            // Show selected page
            document.getElementById(pageName).classList.add("active");


            // Highlight selected button
            document
                .getElementById(pageName + "Button")
                .classList.add("active");
        }

    </script>

</body>
</html>
