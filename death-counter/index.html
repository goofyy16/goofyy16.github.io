<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Death Counter</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #071b2e,
                    #0b4261,
                    #071b2e
                );

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* ==========================
           BACKGROUND GRID
        ========================== */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.07) 2px,
                    transparent 2px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.07) 2px,
                    transparent 2px
                );

            background-size: 50px 50px;

            pointer-events: none;
        }


        /* ==========================
           MAIN COUNTER
        ========================== */

        .counter-box {

            position: relative;

            z-index: 2;

            text-align: center;

            padding: 40px;
        }


        #counter {

            font-family:
                "Arial Black",
                Impact,
                sans-serif;

            font-size: clamp(100px, 25vw, 250px);

            font-weight: 900;

            line-height: 1;

            color: white;

            text-shadow:

                -6px -6px 0 #111,
                 6px -6px 0 #111,
                -6px  6px 0 #111,
                 6px  6px 0 #111,

                0 0 10px #36e6ff,
                0 0 30px #36e6ff;

            margin-bottom: 40px;
        }


        /* ==========================
           BUTTONS
        ========================== */

        .buttons {

            display: flex;

            justify-content: center;

            gap: 20px;

            flex-wrap: wrap;
        }


        button {

            padding: 15px 30px;

            font-size: 18px;

            font-weight: bold;

            background: #ffd900;

            color: #111;

            border: 4px solid #111;

            border-radius: 8px;

            cursor: pointer;

            box-shadow:
                0 5px 0 #8d7500,
                0 0 15px #ffd900;

            transition: 0.1s;
        }


        button:hover {

            transform: translateY(-2px);
        }


        button:active {

            transform: translateY(4px);

            box-shadow:
                0 0 0 #8d7500;
        }


        /* ==========================
           DEATH BUTTON
        ========================== */

        #deathButton {

            background: #ff3b3b;

            color: white;

            box-shadow:
                0 5px 0 #8f1717,
                0 0 15px #ff3b3b;
        }


        /* ==========================
           RESET BUTTON
        ========================== */

        #resetButton {

            background: #ffd900;

            color: #111;
        }


        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            #counter {

                font-size: 30vw;
            }


            button {

                padding: 12px 20px;

                font-size: 15px;
            }

        }

    </style>
</head>


<body>


    <div class="counter-box">


        <!-- DEATH COUNT -->

        <div id="counter">
            0
        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button id="deathButton">
                💀 +1 DEATH
            </button>


            <button id="resetButton">
                RESET
            </button>

        </div>


    </div>


    <script>

        /* ==========================
           LOAD SAVED DEATH COUNT
        ========================== */

        let deaths =
            Number(
                localStorage.getItem("goofyyDeaths")
            );


        /* Make sure the counter starts at 0 */

        if (isNaN(deaths)) {

            deaths = 0;

        }


        /* ==========================
           DISPLAY COUNTER
        ========================== */

        function updateCounter() {

            document.getElementById("counter")
                .textContent = "Deaths = " + deaths;

        }


        updateCounter();


        /* ==========================
           +1 DEATH
        ========================== */

        document
            .getElementById("deathButton")
            .addEventListener("click", function() {

                deaths++;


                localStorage.setItem(
                    "goofyyDeaths",
                    deaths
                );


                updateCounter();

            });


        /* ==========================
           RESET
        ========================== */

        document
            .getElementById("resetButton")
            .addEventListener("click", function() {

                const confirmed =
                    confirm(
                        "Are you sure you want to reset the death counter?"
                    );


                if (!confirmed) {

                    return;

                }


                deaths = 0;


                localStorage.setItem(
                    "goofyyDeaths",
                    deaths
                );


                updateCounter();

            });

    </script>

</body>
</html>
