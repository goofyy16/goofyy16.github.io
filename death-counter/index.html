<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goofyy Death Counter</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            /* GREEN SCREEN */
            background: #00ff00;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* ==========================
           MAIN AREA
        ========================== */

        .container {
            position: relative;

            z-index: 2;

            width: 100%;

            text-align: center;

            padding: 20px;
        }


        /* ==========================
           DEATH COUNTER
        ========================== */

        #counter {

            font-family:
                "Arial Black",
                Impact,
                sans-serif;

            /*
            Keeps Deaths = 0 on ONE line
            */

            font-size: clamp(45px, 9vw, 110px);

            font-weight: 900;

            color: white;

            white-space: nowrap;

            text-align: center;

            margin-bottom: 35px;

            text-shadow:

                -5px -5px 0 #111,
                 5px -5px 0 #111,
                -5px  5px 0 #111,
                 5px  5px 0 #111,

                0 0 8px #36e6ff,
                0 0 20px #36e6ff;
        }


        /* ==========================
           MADE BY
        ========================== */

        .made-by {

            margin-bottom: 10px;

            font-size: 14px;

            font-weight: bold;

            color: white;

            text-shadow:

                -2px -2px 0 #111,
                 2px -2px 0 #111,
                -2px  2px 0 #111,
                 2px  2px 0 #111;
        }


        /* ==========================
           BUTTONS
        ========================== */

        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 30px;
        }


        button {

            padding: 12px 22px;

            font-size: 16px;

            font-weight: bold;

            background: #ffd900;

            color: #111;

            border: 4px solid #111;

            border-radius: 7px;

            cursor: pointer;

            box-shadow:

                0 4px 0 #8d7500,

                0 0 12px #ffd900;
        }


        button:hover {

            transform: translateY(-2px);
        }


        button:active {

            transform: translateY(4px);

            box-shadow:

                0 0 0 #8d7500;
        }


        /* ==========================
           DEATH BUTTON
        ========================== */

        #deathButton {

            background: #ff3b3b;

            color: white;

            box-shadow:

                0 4px 0 #8f1717,

                0 0 12px #ff3b3b;
        }


        /* ==========================
           TWITCH BOX
        ========================== */

        .twitch-box {

            margin: 0 auto;

            width: min(450px, 90vw);

            padding: 20px;

            background: rgba(0, 0, 0, 0.35);

            border: 3px solid #9146ff;

            border-radius: 12px;

            box-shadow:

                0 0 20px rgba(145,70,255,0.5);
        }


        .twitch-box h2 {

            margin-top: 0;

            font-size: 20px;

            color: white;

            text-shadow:

                2px 2px 0 #111;
        }


        /* ==========================
           CHANNEL INPUT
        ========================== */

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            font-size: 16px;

            border: 3px solid #111;

            border-radius: 7px;

            outline: none;
        }


        /* ==========================
           CONNECT BUTTON
        ========================== */

        #connectButton {

            background: #9146ff;

            color: white;

            box-shadow:

                0 4px 0 #54238c,

                0 0 12px #9146ff;
        }


        /* ==========================
           STATUS
        ========================== */

        #status {

            margin-top: 15px;

            font-size: 14px;

            color: white;

            text-shadow:

                1px 1px 0 #111;
        }


        .connected {

            color: #50fa7b !important;
        }


        .error {

            color: #ff5555 !important;
        }


        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            #counter {

                font-size: 11vw;

                letter-spacing: 0;
            }


            .made-by {

                font-size: 13px;
            }


            .buttons {

                gap: 8px;
            }


            button {

                padding: 10px 16px;

                font-size: 14px;
            }

        }

    </style>
</head>


<body>


    <div class="container">


        <!-- DEATH COUNTER -->

        <div id="counter">
            Deaths = 0
        </div>


        <!-- MADE BY -->

        <div class="made-by">
            made by Goofyy
        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button id="deathButton">
                💀 +1 DEATH
            </button>


            <button id="resetButton">
                RESET
            </button>

        </div>


        <!-- TWITCH CONNECTION -->

        <div class="twitch-box">

            <h2>
                Connect Twitch Chat
            </h2>


            <input
                id="channelInput"
                type="text"
                placeholder="Twitch channel name"
                autocomplete="off"
            >


            <button id="connectButton">
                CONNECT WITH TWITCH
            </button>


            <div id="status">
                🔴 Not connected
            </div>

        </div>


    </div>


<script>


/* =========================================================
   TWITCH CLIENT ID
   ========================================================= */

const CLIENT_ID =
    "ohc9gdo3a4s0g38r48lb4qb3ybims2";


/* =========================================================
   TWITCH SETTINGS
   ========================================================= */

const REDIRECT_URI =
    "https://goofyy16.github.io/death-counter/";


const SCOPES =
    "user:read:chat";


/* =========================================================
   DEATH COUNTER
   ========================================================= */

let deaths =
    Number(
        localStorage.getItem("goofyyDeaths")
    );


if (isNaN(deaths)) {

    deaths = 0;

}


/* =========================================================
   UPDATE COUNTER
   ========================================================= */

function updateCounter() {

    document
        .getElementById("counter")
        .textContent =
        "Deaths = " + deaths;

}


updateCounter();


/* =========================================================
   ADD DEATH
   ========================================================= */

function addDeath() {

    deaths++;


    localStorage.setItem(
        "goofyyDeaths",
        deaths
    );


    updateCounter();

}


document
    .getElementById("deathButton")
    .addEventListener(
        "click",
        addDeath
    );


/* =========================================================
   RESET
   ========================================================= */

function resetDeaths() {

    const confirmed =
        confirm(
            "Are you sure you want to reset the death counter?"
        );


    if (!confirmed) {

        return;

    }


    deaths = 0;


    localStorage.setItem(
        "goofyyDeaths",
        deaths
    );


    updateCounter();

}


document
    .getElementById("resetButton")
    .addEventListener(
        "click",
        resetDeaths
    );


/* =========================================================
   TWITCH LOGIN
   ========================================================= */

function loginWithTwitch(channel) {

    localStorage.setItem(
        "requestedChannel",
        channel
    );


    const authURL =
        "https://id.twitch.tv/oauth2/authorize"
        + "?client_id="
        + encodeURIComponent(CLIENT_ID)
        + "&redirect_uri="
        + encodeURIComponent(REDIRECT_URI)
        + "&response_type=token"
        + "&scope="
        + encodeURIComponent(SCOPES);


    window.location.href =
        authURL;

}


/* =========================================================
   CONNECT BUTTON
   ========================================================= */

document
    .getElementById("connectButton")
    .addEventListener(
        "click",
        function() {

            const channel =
                document
                    .getElementById("channelInput")
                    .value
                    .trim()
                    .toLowerCase();


            if (!channel) {

                setStatus(
                    "Enter a Twitch channel first.",
                    true
                );

                return;

            }


            loginWithTwitch(
                channel
            );

        }
    );


/* =========================================================
   GET TOKEN
   ========================================================= */

function getTokenFromURL() {

    const hash =
        window.location.hash.substring(1);


    const params =
        new URLSearchParams(hash);


    return params.get(
        "access_token"
    );

}


const twitchToken =
    getTokenFromURL();


/* =========================================================
   CONNECT IF LOGGED IN
   ========================================================= */

if (twitchToken) {

    const channel =
        localStorage.getItem(
            "requestedChannel"
        );


    if (channel) {

        document
            .getElementById("channelInput")
            .value =
            channel;


        connectToTwitch(
            twitchToken,
            channel
        );

    }


    history.replaceState(
        null,
        "",
        window.location.pathname
    );

}


/* =========================================================
   TWITCH CONNECTION
   ========================================================= */

async function connectToTwitch(
    token,
    channel
) {

    setStatus(
        "🟡 Connecting to Twitch..."
    );


    try {

        const userResponse =
            await fetch(
                "https://api.twitch.tv/helix/users",
                {
                    headers: {

                        "Client-ID":
                            CLIENT_ID,

                        "Authorization":
                            "Bearer " +
                            token
                    }
                }
            );


        if (!userResponse.ok) {

            throw new Error(
                "Twitch authorization failed."
            );

        }


        const userData =
            await userResponse.json();


        const user =
            userData.data[0];


        const channelResponse =
            await fetch(
                "https://api.twitch.tv/helix/users?login="
                +
                encodeURIComponent(
                    channel
                ),
                {
                    headers: {

                        "Client-ID":
                            CLIENT_ID,

                        "Authorization":
                            "Bearer " +
                            token
                    }
                }
            );


        if (!channelResponse.ok) {

            throw new Error(
                "Could not find that Twitch channel."
            );

        }


        const channelData =
            await channelResponse.json();


        if (
            !channelData.data ||
            channelData.data.length === 0
        ) {

            throw new Error(
                "Twitch channel not found."
            );

        }


        const broadcaster =
            channelData.data[0];


        const socket =
            new WebSocket(
                "wss://eventsub.wss.twitch.tv/ws"
            );


        socket.onopen =
            function() {

                setStatus(
                    "🟡 Connected. Waiting for Twitch..."
                );

            };


        socket.onmessage =
            async function(message) {

                const data =
                    JSON.parse(
                        message.data
                    );


                if (
                    data.metadata
                        .message_type
                    ===
                    "session_welcome"
                ) {

                    const sessionID =
                        data.payload
                            .session
                            .id;


                    await subscribeToChat(
                        sessionID,
                        token,
                        broadcaster.id,
                        user.id
                    );

                }


                if (
                    data.metadata
                        .message_type
                    ===
                    "notification"
                    &&
                    data.metadata
                        .subscription_type
                    ===
                    "channel.chat.message"
                ) {

                    const chatMessage =
                        data.payload.event
                            .message
                            .text
                            .trim()
                            .toLowerCase();


                    if (
                        chatMessage ===
                        "!death"
                    ) {

                        addDeath();

                    }

                }

            };


        socket.onerror =
            function() {

                setStatus(
                    "🔴 Twitch connection error.",
                    true
                );

            };


        socket.onclose =
            function() {

                setStatus(
                    "🔴 Twitch connection closed.",
                    true
                );

            };

    }

    catch (error) {

        console.error(error);


        setStatus(
            "🔴 " +
            error.message,
            true
        );

    }

}


/* =========================================================
   SUBSCRIBE TO CHAT
   ========================================================= */

async function subscribeToChat(
    sessionID,
    token,
    broadcasterID,
    userID
) {

    const response =
        await fetch(
            "https://api.twitch.tv/helix/eventsub/subscriptions",
            {

                method: "POST",

                headers: {

                    "Client-ID":
                        CLIENT_ID,

                    "Authorization":
                        "Bearer " +
                        token,

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    type:
                        "channel.chat.message",

                    version:
                        "1",

                    condition: {

                        broadcaster_user_id:
                            broadcasterID,

                        user_id:
                            userID

                    },

                    transport: {

                        method:
                            "websocket",

                        session_id:
                            sessionID

                    }

                })

            }
        );


    if (!response.ok) {

        const errorText =
            await response.text();


        console.error(
            errorText
        );


        setStatus(
            "🔴 Twitch could not start chat listening.",
            true
        );


        return;

    }


    setStatus(
        "🟢 Listening for !death in " +
        localStorage.getItem(
            "requestedChannel"
        ) +
        " chat"
    );

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
    message,
    error = false
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        error
            ? "error"
            : "connected";

}

</script>

</body>
</html>
