<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(135deg, #071b2e, #0b4261, #071b2e);

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* ==========================
           BACKGROUND GRID
        ========================== */

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.07) 2px,
                    transparent 2px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.07) 2px,
                    transparent 2px
                );

            background-size: 50px 50px;

            pointer-events: none;
        }


        /* ==========================
           TIMER
        ========================== */

        #timer {

            position: relative;

            z-index: 2;

            font-family:
                "Arial Black",
                Impact,
                sans-serif;

            font-size: clamp(60px, 14vw, 150px);

            font-weight: 900;

            letter-spacing: 6px;

            color: #ffffff;

            text-align: center;

            text-shadow:

                -5px -5px 0 #111,
                 5px -5px 0 #111,
                -5px  5px 0 #111,
                 5px  5px 0 #111,

                 0 0 8px #36e6ff,
                 0 0 20px #36e6ff;
        }


        /* ==========================
           LITTLE CUBE
        ========================== */

        .cube {

            position: fixed;

            top: 50%;
            left: calc(50% + 230px);

            transform: translateY(-50%);

            width: 70px;
            height: 70px;

            background: #ffd900;

            border: 6px solid #111;

            box-shadow:
                0 0 10px #ffd900,
                0 0 25px #ffd900;

            z-index: 5;
        }


        /* Cube eyes */

        .cube::before,
        .cube::after {

            content: "";

            position: absolute;

            width: 12px;
            height: 18px;

            background: white;

            border: 3px solid #111;
        }


        .cube::before {

            left: 12px;
            top: 12px;
        }


        .cube::after {

            right: 12px;
            top: 12px;
        }


        /* Cube mouth */

        .cube-mouth {

            position: absolute;

            left: 14px;
            right: 14px;

            bottom: 12px;

            height: 8px;

            background: #111;
        }


        /* ==========================
           BUTTONS
        ========================== */

        .buttons {

            position: fixed;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;

            gap: 15px;

            z-index: 10;
        }


        button {

            padding: 12px 22px;

            font-size: 16px;

            font-weight: bold;

            background: #ffd900;

            color: #111;

            border: 4px solid #111;

            border-radius: 7px;

            cursor: pointer;

            box-shadow:
                0 4px 0 #8d7500,
                0 0 12px #ffd900;
        }


        button:hover {

            transform: translateY(-2px);
        }


        button:active {

            transform: translateY(4px);

            box-shadow:
                0 0 0 #8d7500;
        }


        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 800px) {

            #timer {

                font-size: 13vw;

                letter-spacing: 2px;
            }


            .cube {

                position: absolute;

                width: 50px;
                height: 50px;

                left: auto;
                right: 20px;

                top: 20px;

                transform: none;
            }


            .cube::before,
            .cube::after {

                width: 8px;
                height: 12px;
            }


            .cube::before {

                left: 8px;
                top: 8px;
            }


            .cube::after {

                right: 8px;
                top: 8px;
            }


            .cube-mouth {

                left: 10px;
                right: 10px;

                bottom: 8px;

                height: 6px;
            }


            .buttons {

                bottom: 20px;

                gap: 8px;
            }


            button {

                padding: 10px 16px;

                font-size: 14px;
            }
        }

    </style>
</head>


<body>


    <!-- TIMER -->

    <div id="timer">
        00:00:00
    </div>


    <!-- LITTLE GEOMETRY DASH CUBE -->

    <div class="cube">

        <div class="cube-mouth"></div>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button id="pause">
            PAUSE
        </button>

        <button id="reset">
            RESET
        </button>

    </div>


    <script>

        /* ==========================
           TIMER VARIABLES
        ========================== */

        let startTime = Date.now();

        let pausedTime = 0;

        let isPaused = false;

        let pauseStarted = 0;


        /* ==========================
           UPDATE TIMER
        ========================== */

        function updateTimer() {

            let elapsed;


            if (isPaused) {

                elapsed =
                    pauseStarted
                    - startTime
                    - pausedTime;

            } else {

                elapsed =
                    Date.now()
                    - startTime
                    - pausedTime;
            }


            let totalSeconds =
                Math.floor(elapsed / 1000);


            const hours =
                Math.floor(totalSeconds / 3600);


            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );


            const seconds =
                totalSeconds % 60;


            document.getElementById("timer")
                .textContent =

                String(hours).padStart(2, "0")
                + ":"
                + String(minutes).padStart(2, "0")
                + ":"
                + String(seconds).padStart(2, "0");
        }


        /* ==========================
           RUN TIMER
        ========================== */

        setInterval(updateTimer, 1000);

        updateTimer();


        /* ==========================
           PAUSE / RESUME
        ========================== */

        document
            .getElementById("pause")
            .addEventListener("click", function() {

                if (!isPaused) {

                    /*
                    Pause the timer
                    */

                    isPaused = true;

                    pauseStarted = Date.now();

                    this.textContent = "RESUME";

                } else {

                    /*
                    Resume the timer
                    */

                    pausedTime +=
                        Date.now() - pauseStarted;

                    isPaused = false;

                    this.textContent = "PAUSE";
                }


                updateTimer();

            });


        /* ==========================
           RESET
        ========================== */

        document
            .getElementById("reset")
            .addEventListener("click", function() {

                startTime = Date.now();

                pausedTime = 0;

                isPaused = false;

                pauseStarted = 0;


                document.getElementById("pause")
                    .textContent = "PAUSE";


                updateTimer();

            });

    </script>

</body>
</html>
