<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goofyy Timer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            /* GREEN SCREEN */
            background: #00ff00;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* ==========================
           TIMER AREA
        ========================== */

        .timer-area {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            position: relative;

            z-index: 2;
        }


        /* ==========================
           MADE BY GOOFYY
        ========================== */

        .made-by {

            margin-bottom: 8px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 18px;

            font-weight: bold;

            color: white;

            text-shadow:

                -2px -2px 0 #111,
                 2px -2px 0 #111,
                -2px  2px 0 #111,
                 2px  2px 0 #111;
        }


        /* ==========================
           TIMER
        ========================== */

        #timer {

            font-family:
                "Arial Black",
                Impact,
                sans-serif;

            font-size: clamp(80px, 18vw, 200px);

            font-weight: 900;

            letter-spacing: 6px;

            color: white;

            white-space: nowrap;

            text-align: center;

            text-shadow:

                -5px -5px 0 #111,
                 5px -5px 0 #111,
                -5px  5px 0 #111,
                 5px  5px 0 #111,

                0 0 8px #36e6ff,
                0 0 20px #36e6ff;
        }


        /* ==========================
           BUTTONS
        ========================== */

        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 25px;
        }


        button {

            padding: 12px 22px;

            font-size: 16px;

            font-weight: bold;

            background: #ffd900;

            color: #111;

            border: 4px solid #111;

            border-radius: 7px;

            cursor: pointer;

            box-shadow:
                0 4px 0 #8d7500,
                0 0 12px #ffd900;
        }


        button:hover {

            transform: translateY(-2px);
        }


        button:active {

            transform: translateY(4px);

            box-shadow:
                0 0 0 #8d7500;
        }


        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 800px) {

            #timer {

                font-size: 13vw;

                letter-spacing: 2px;
            }


            .made-by {

                font-size: 14px;
            }


            .buttons {

                gap: 8px;

                margin-top: 15px;
            }


            button {

                padding: 10px 16px;

                font-size: 14px;
            }
        }

    </style>
</head>


<body>


    <div class="timer-area">


        <!-- MADE BY -->

        <div class="made-by">
            made by Goofyy
        </div>


        <!-- TIMER -->

        <div id="timer">
            00:00:00
        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button id="pause">
                PAUSE
            </button>


            <button id="reset">
                RESET
            </button>

        </div>


    </div>


    <script>

        /* ==========================
           TIMER VARIABLES
        ========================== */

        let startTime = Date.now();

        let pausedTime = 0;

        let isPaused = false;

        let pauseStarted = 0;


        /* ==========================
           UPDATE TIMER
        ========================== */

        function updateTimer() {

            let elapsed;


            if (isPaused) {

                elapsed =
                    pauseStarted
                    - startTime
                    - pausedTime;

            } else {

                elapsed =
                    Date.now()
                    - startTime
                    - pausedTime;
            }


            let totalSeconds =
                Math.floor(elapsed / 1000);


            const hours =
                Math.floor(totalSeconds / 3600);


            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );


            const seconds =
                totalSeconds % 60;


            document.getElementById("timer")
                .textContent =

                String(hours).padStart(2, "0")
                + ":"
                + String(minutes).padStart(2, "0")
                + ":"
                + String(seconds).padStart(2, "0");

        }


        setInterval(updateTimer, 1000);

        updateTimer();


        /* ==========================
           PAUSE / RESUME
        ========================== */

        document
            .getElementById("pause")
            .addEventListener("click", function() {

                if (!isPaused) {

                    isPaused = true;

                    pauseStarted = Date.now();

                    this.textContent = "RESUME";

                } else {

                    pausedTime +=
                        Date.now() - pauseStarted;

                    isPaused = false;

                    this.textContent = "PAUSE";
                }


                updateTimer();

            });


        /* ==========================
           RESET
        ========================== */

        document
            .getElementById("reset")
            .addEventListener("click", function() {

                startTime = Date.now();

                pausedTime = 0;

                isPaused = false;

                pauseStarted = 0;


                document.getElementById("pause")
                    .textContent = "PAUSE";


                updateTimer();

            });

    </script>

</body>
</html>
