<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chest Counter</title>
<style>
  :root { color-scheme: dark; --gold:#f5b51b; --gold2:#ffdf72; --ink:#17120a; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:22px;
    font-family:Arial,Helvetica,sans-serif; color:#fff7df;
    background:radial-gradient(ellipse at top, #5a4215 0%, #211a0d 48%, #0c0a07 100%);
  }
  .app {
    width:min(680px,100%); text-align:center; padding:28px 22px 24px;
    border:2px solid #bd861b; border-radius:24px;
    background:linear-gradient(155deg,rgba(58,42,12,.96),rgba(18,15,10,.98));
    box-shadow:0 18px 60px #0009, inset 0 0 35px #f4b51b14;
  }
  .emblem {
    width:min(240px,58vw); aspect-ratio:1; object-fit:contain;
    border-radius:50%; filter:drop-shadow(0 8px 14px #0009);
  }
  h1 { margin:8px 0 3px; color:var(--gold2); letter-spacing:5px; font-size:clamp(28px,6vw,42px); }
  .sub { margin:0 0 22px; color:#e5c77f; font-size:13px; letter-spacing:2px; text-transform:uppercase; }
  .panel { background:#0908069c; border:1px solid #9c701f; border-radius:16px; padding:18px; }
  .count { font-size:clamp(64px,15vw,104px); line-height:1.05; font-weight:800; color:#ffcf48; text-shadow:0 3px 0 #7e4b05,0 0 25px #ffb30055; margin:8px 0 18px; overflow-wrap:anywhere; }
  button, input {
    font:inherit; border-radius:11px; border:1px solid #bd861b; min-height:48px;
  }
  button { cursor:pointer; font-weight:800; color:#211704; background:linear-gradient(#ffdf72,#d9940e); padding:11px 18px; box-shadow:0 3px 0 #7b4d08; }
  button:active { transform:translateY(2px); box-shadow:0 1px 0 #7b4d08; }
  button.secondary { color:#fff1c8; background:linear-gradient(#55401c,#30220d); box-shadow:0 3px 0 #120d06; }
  button:focus-visible,input:focus-visible { outline:3px solid #fff0a6; outline-offset:3px; }
  .main-buttons { display:grid; grid-template-columns:1fr 1.25fr 1fr; gap:10px; }
  .main-buttons button { font-size:22px; }
  .custom { display:flex; gap:9px; margin-top:14px; }
  input { min-width:0; width:100%; padding:10px 12px; color:#fff7df; background:#171108; }
  .custom button { white-space:nowrap; }
  .save { margin-top:18px; text-align:left; }
  .save label { display:block; margin-bottom:8px; color:#f5d78f; font-size:14px; font-weight:700; }
  .save-row { display:flex; gap:9px; }
  .save-row button { white-space:nowrap; }
  .hint { color:#c9b88d; font-size:12px; line-height:1.5; margin:12px 2px 0; }
  .status { min-height:20px; margin-top:10px; color:#ffdf72; font-size:13px; }
  @media(max-width:430px) {
    .app { padding:20px 14px; }
    .main-buttons { grid-template-columns:1fr 1fr; }
    .main-buttons button:nth-child(2) { grid-column:1 / -1; grid-row:1; }
    .custom, .save-row { flex-direction:column; }
    .custom button, .save-row button { width:100%; }
  }
</style>
</head>

  <h1>CHEST COUNTER</h1>
  <p class="sub">Track your chests. Save your count.</p>

  <section class="panel" aria-label="Counter">
    <div id="count" class="count" aria-live="polite">0</div>
    <div class="main-buttons">
      <button class="secondary" id="minus" type="button" aria-label="Subtract one">−1</button>
      <button id="plus" type="button" aria-label="Add one">+1</button>
      <button class="secondary" id="reset" type="button">Reset</button>
    </div>
    <div class="custom">
      <input id="amount" type="number" step="1" placeholder="Custom amount (e.g. 25)" aria-label="Custom amount">
      <button id="addCustom" type="button">Add amount</button>
    </div>
  </section>

  <section class="save">
    <label for="saveCode">SAVE CODE</label>
    <div class="save-row">
      <input id="saveCode" type="text" placeholder="Enter a code, e.g. 1" autocomplete="off" maxlength="40">
      <button id="loadSave" type="button">Load / Create</button>
    </div>
    <p class="hint">Your counter saves automatically under this code in this browser. Use the same browser and device to get it back. No account or internet connection needed.</p>
    <div id="status" class="status" role="status"></div>
  </section>
</main>
<script>
(() => {
  const STORAGE_KEY = "fCounter_saves_v1";
  let saves = {};
  let activeCode = null;
  let count = 0;

  const countEl = document.getElementById("count");
  const codeEl = document.getElementById("saveCode");
  const statusEl = document.getElementById("status");
  const amountEl = document.getElementById("amount");

  try {
    saves = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    if (!saves || typeof saves !== "object" || Array.isArray(saves)) saves = {};
  } catch (_) { saves = {}; }

  function render() { countEl.textContent = String(count); }
  function persist() {
    if (!activeCode) return;
    saves[activeCode] = count;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saves));
      statusEl.textContent = `Saved as code "${activeCode}".`;
    } catch (_) {
      statusEl.textContent = "Could not save in this browser. Check browser storage settings.";
    }
  }
  function changeBy(amount) {
    if (!Number.isFinite(amount)) return;
    count += amount;
    render();
    persist();
  }

  document.getElementById("loadSave").addEventListener("click", () => {
    const code = codeEl.value.trim();
    if (!code) { statusEl.textContent = "Enter a save code first."; codeEl.focus(); return; }
    activeCode = code;
    if (Object.prototype.hasOwnProperty.call(saves, code)) {
      count = Number(saves[code]) || 0;
      statusEl.textContent = `Loaded code "${code}".`;
    } else {
      count = 0;
      saves[code] = count;
      statusEl.textContent = `New counter created with code "${code}".`;
    }
    render();
    persist();
  });

  document.getElementById("plus").addEventListener("click", () => changeBy(1));
  document.getElementById("minus").addEventListener("click", () => changeBy(-1));
  document.getElementById("reset").addEventListener("click", () => {
    count = 0; render(); persist();
  });
  document.getElementById("addCustom").addEventListener("click", () => {
    const raw = amountEl.value.trim();
    const amount = Number(raw);
    if (!raw || !Number.isFinite(amount)) { statusEl.textContent = "Enter a valid number to add."; amountEl.focus(); return; }
    changeBy(amount);
    amountEl.value = "";
  });
  amountEl.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("addCustom").click();
  });
  codeEl.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("loadSave").click();
  });
  document.addEventListener("keydown", e => {
    if (e.code !== "Space" || e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
    e.preventDefault();
    changeBy(1);
  });
  render();
  statusEl.textContent = "Enter a save code to load or create a counter.";
})();
</script>
</body>
</html>
