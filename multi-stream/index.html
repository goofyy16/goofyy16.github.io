<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Multi-Stream - Goofyy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #00ff00;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 20px 0 0;
      font-size: 42px;
      font-weight: 900;
      text-shadow: 3px 3px 0 #000;
    }

    .made-by {
      margin: 3px 0 15px;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
    }

    .streams {
      width: 96%;
      max-width: 1600px;
      margin: 0 auto 30px;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .stream-box {
      background: #111;
      border: 3px solid white;
      border-radius: 10px;
      overflow: hidden;
    }

    .controls {
      padding: 10px;
      display: flex;
      gap: 8px;
      background: #111;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 2px solid white;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 10px 16px;
      border: 2px solid white;
      border-radius: 6px;
      background: #9147ff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #772ce8;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }

    .player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 800px) {
      .streams {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <h1>MULTI-STREAM</h1>

  <div class="made-by">
    made by Goofyy
  </div>

  <div class="streams">

    <!-- STREAM 1 -->
    <div class="stream-box">
      <div class="controls">
        <input
          id="username1"
          type="text"
          placeholder="Type Twitch username"
        >
        <button onclick="loadStream(1)">WATCH</button>
      </div>

      <div class="player" id="player1">
        Type a Twitch username
      </div>
    </div>


    <!-- STREAM 2 -->
    <div class="stream-box">
      <div class="controls">
        <input
          id="username2"
          type="text"
          placeholder="Type Twitch username"
        >
        <button onclick="loadStream(2)">WATCH</button>
      </div>

      <div class="player" id="player2">
        Type a Twitch username
      </div>
    </div>


    <!-- STREAM 3 -->
    <div class="stream-box">
      <div class="controls">
        <input
          id="username3"
          type="text"
          placeholder="Type Twitch username"
        >
        <button onclick="loadStream(3)">WATCH</button>
      </div>

      <div class="player" id="player3">
        Type a Twitch username
      </div>
    </div>


    <!-- STREAM 4 -->
    <div class="stream-box">
      <div class="controls">
        <input
          id="username4"
          type="text"
          placeholder="Type Twitch username"
        >
        <button onclick="loadStream(4)">WATCH</button>
      </div>

      <div class="player" id="player4">
        Type a Twitch username
      </div>
    </div>

  </div>


  <script>
    function loadStream(number) {

      const input = document.getElementById("username" + number);
      const player = document.getElementById("player" + number);

      let username = input.value.trim();

      if (!username) {
        player.innerHTML = "Please type a Twitch username";
        return;
      }

      // Remove twitch.tv if someone pastes the full URL
      username = username
        .replace("https://www.twitch.tv/", "")
        .replace("https://twitch.tv/", "")
        .replace("www.twitch.tv/", "")
        .replace("twitch.tv/", "")
        .replace("/", "")
        .trim();

      const encodedUsername = encodeURIComponent(username);

      const twitchURL =
        "https://player.twitch.tv/?channel=" +
        encodedUsername +
        "&parent=goofyy16.github.io";

      player.innerHTML = `
        <iframe
          src="${twitchURL}"
          allowfullscreen>
        </iframe>
      `;
    }


    // Press Enter instead of clicking WATCH
    document.querySelectorAll("input").forEach(function(input) {

      input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          const number = this.id.replace("username", "");

          loadStream(number);

        }

      });

    });
  </script>

</body>
</html>
