<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goofyy Multi-Stream</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #111;

            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* ==========================
           HEADER
        ========================== */

        header {
            text-align: center;

            padding: 20px 10px;

            background: #181818;

            border-bottom: 3px solid #9146ff;
        }


        header h1 {
            margin: 0;

            font-family:
                "Arial Black",
                Impact,
                sans-serif;

            font-size: 32px;

            text-shadow:
                3px 3px 0 #000;
        }


        .made-by {
            margin-top: 5px;

            font-size: 13px;

            color: #aaa;
        }


        /* ==========================
           STREAM GRID
        ========================== */

        .stream-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            padding: 12px;

            max-width: 1800px;

            margin: 0 auto;
        }


        /* ==========================
           STREAM BOX
        ========================== */

        .stream-box {

            background: #181818;

            border: 3px solid #333;

            border-radius: 8px;

            overflow: hidden;

            min-width: 0;
        }


        /* ==========================
           CONTROLS
        ========================== */

        .controls {

            display: flex;

            gap: 8px;

            padding: 10px;

            background: #222;
        }


        .username {

            flex: 1;

            min-width: 0;

            padding: 10px;

            font-size: 15px;

            color: white;

            background: #111;

            border: 2px solid #555;

            border-radius: 5px;

            outline: none;
        }


        .username:focus {

            border-color: #9146ff;
        }


        .watch-button {

            padding: 10px 18px;

            font-size: 14px;

            font-weight: bold;

            color: white;

            background: #9146ff;

            border: none;

            border-radius: 5px;

            cursor: pointer;
        }


        .watch-button:hover {

            background: #772ce8;
        }


        /* ==========================
           PLAYER
        ========================== */

        .player {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;
        }


        .player iframe {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            border: none;
        }


        /* ==========================
           PLACEHOLDER
        ========================== */

        .placeholder {

            position: absolute;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            color: #777;

            font-size: 20px;

            pointer-events: none;
        }


        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 800px) {

            .stream-grid {

                grid-template-columns: 1fr;
            }


            header h1 {

                font-size: 26px;
            }

        }

    </style>
</head>
